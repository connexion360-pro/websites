[package]
name = "nsf-web-converter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Client-side NSF converter powered by sherlock-nsf-parser"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherlock-nsf-parser = "=0.1.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
console_error_panic_hook = "0.1"
